app-id: org.zeravrix.ZERAVRIX
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk21
command: zeravrix
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --filesystem=xdg-download
  - --filesystem=xdg-pictures
  - --filesystem=xdg-documents
  - --env=JAVA_HOME=/usr/lib/sdk/openjdk21
  - --env=PATH=/app/bin:/usr/bin:/usr/lib/sdk/openjdk21/bin

modules:
  - name: openjdk
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/openjdk21/enable.sh

  - name: zeravrix
    buildsystem: simple
    build-commands:
      - mkdir -p /app/bin /app/lib/zeravrix /app/share/applications /app/share/metainfo /app/share/icons/hicolor/256x256/apps /app/share/icons/hicolor/512x512/apps /app/share/icons/hicolor/1024x1024/apps
      - cp -r app/* /app/lib/zeravrix/
      - install -m 755 zeravrix-flatpak.sh /app/bin/zeravrix
      - install -m 644 org.zeravrix.ZERAVRIX.desktop /app/share/applications/org.zeravrix.ZERAVRIX.desktop
      - install -m 644 org.zeravrix.ZERAVRIX.metainfo.xml /app/share/metainfo/org.zeravrix.ZERAVRIX.metainfo.xml
      - install -m 644 org.zeravrix.ZERAVRIX.png /app/share/icons/hicolor/1024x1024/apps/org.zeravrix.ZERAVRIX.png
      - install -m 644 org.zeravrix.ZERAVRIX.png /app/share/icons/hicolor/512x512/apps/org.zeravrix.ZERAVRIX.png
      - install -m 644 org.zeravrix.ZERAVRIX.png /app/share/icons/hicolor/256x256/apps/org.zeravrix.ZERAVRIX.png
    sources:
      - type: file
        path: zeravrix-flatpak.sh
      - type: file
        path: org.zeravrix.ZERAVRIX.desktop
      - type: file
        path: org.zeravrix.ZERAVRIX.metainfo.xml
      - type: file
        path: org.zeravrix.ZERAVRIX.png
      - type: dir
        path: ../../desktop-app/build/compose/binaries/main/app/zeravrix/app
        dest: app
